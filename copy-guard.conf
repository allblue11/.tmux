# 复制守卫绑定：把 oh-my-tmux 默认的 clip.exe 复制路径全改走 clip-guard.sh（空/纯空白不写剪贴板）。
# 由 fix-mouse-copy.sh 反复 source，直到盖过 oh-my-tmux 的 _apply_configuration。
# 鼠标：微拖动 / 双击选词 / 三击选行
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
bind -T copy-mode    DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
bind -T copy-mode    TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
# 非 copy-mode 时的双击/三击（root 表，oh-my-tmux 原样结构，只把 clip.exe 换成守卫）
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh' }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh' }
# 键盘复制键
bind -T copy-mode    M-w   send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
bind -T copy-mode    C-w   send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '/root/.tmux/clip-guard.sh'
